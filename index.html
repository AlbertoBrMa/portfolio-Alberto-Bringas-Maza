<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Bloqueante a propósito: decide tema e idioma antes del primer
      // pintado, para no ver un parpadeo al cargar. Si el usuario ya eligió
      // a mano (localStorage), se respeta esa elección; si no, se sigue la
      // preferencia del navegador/sistema.
      ;(function () {
        var savedTheme = localStorage.getItem('theme')
        var isDark = savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', isDark)

        var savedLang = localStorage.getItem('lang')
        var lang = savedLang === 'es' || savedLang === 'en'
          ? savedLang
          : (navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'es'
        document.documentElement.lang = lang
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alberto Bringas Maza — Desarrollador de Software</title>
    <meta name="description" content="Portfolio de Alberto Bringas Maza, desarrollador de software especializado en React, Python, IA y datos. Proyectos de chatbots RAG, apps geoespaciales y más." />
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Alberto Bringas Maza — Desarrollador de Software" />
    <meta property="og:description" content="Portfolio de Alberto Bringas Maza, desarrollador de software especializado en React, Python, IA y datos." />
    <meta name="twitter:card"       content="summary_large_image" />
    <meta name="twitter:title"      content="Alberto Bringas Maza — Desarrollador de Software" />
    <meta name="twitter:description" content="Portfolio de Alberto Bringas Maza, desarrollador de software especializado en React, Python, IA y datos." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Carga no bloqueante: si fonts.googleapis.com tarda o no responde (redes
         restringidas, navegadores in-app), la página pinta igual con la fuente
         de sistema y cambia a la de Google en cuanto llegue, en vez de quedarse
         esperando indefinidamente antes del primer pintado. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Diagnóstico temporal: si algo falla antes de que React llegue a
      // montar (incompatibilidad de JS en un navegador concreto, script
      // bloqueado, etc.), en vez de dejar la pantalla en blanco se muestra
      // el error para poder hacer una foto y reportarlo. Escrito en JS
      // plano (sin sintaxis moderna) para que funcione igual en el
      // navegador que esté fallando.
      (function () {
        var lastError = null

        function showFallback(message) {
          var root = document.getElementById('root')
          if (!root || root.getAttribute('data-app-mounted') === '1') return
          root.innerHTML =
            '<div style="font-family: monospace; font-size: 13px; color: #f3f4f6; ' +
            'background: #0a0a0f; min-height: 100vh; padding: 24px; white-space: pre-wrap;">' +
            'Ha ocurrido un error al cargar la página.\n' +
            'Por favor, haz una foto a este mensaje y compártelo:\n\n' +
            message +
            '</div>'
        }

        window.addEventListener('error', function (e) {
          lastError = (e && e.message) || 'Error desconocido'
          if (e && e.filename) lastError += '\n' + e.filename + ':' + e.lineno
        })
        window.addEventListener('unhandledrejection', function (e) {
          lastError = 'Promise rechazada: ' + ((e && e.reason && e.reason.message) || e.reason)
        })

        setTimeout(function () {
          var root = document.getElementById('root')
          var mounted = root && root.getAttribute('data-app-mounted') === '1'
          if (!mounted) {
            showFallback(lastError || ('La app no llegó a arrancar (sin error capturado).\n' + navigator.userAgent))
          }
        }, 4000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
